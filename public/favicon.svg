<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0F1219" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#emerald)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Phone Body -->
  <rect x="146" y="86" width="220" height="340" rx="36" fill="#1E293B" stroke="url(#emerald)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Screen Area -->
  <rect x="162" y="118" width="188" height="276" rx="20" fill="#0B0E14" />

  <!-- Dynamic Island / Notch -->
  <rect x="216" y="130" width="80" height="18" rx="9" fill="#0F172A" />

  <!-- Shopping Bag / POS icon in emerald glow -->
  <path d="M 216 230 C 216 200 296 200 296 230 H 316 V 320 C 316 332 306 342 294 342 H 218 C 206 342 196 332 196 320 V 230 Z" fill="url(#emerald)" opacity="0.95" />
  <path d="M 228 230 C 228 212 284 212 284 230" fill="none" stroke="#0B0E14" stroke-width="6" stroke-linecap="round" />

  <!-- POS Dollar / Coin accent -->
  <circle cx="340" cy="180" r="32" fill="#F59E0B" />
  <text x="340" y="190" font-family="monospace" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">$</text>
</svg>
