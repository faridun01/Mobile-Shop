events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting against DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream app_backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # style-src allows 'unsafe-inline' because the app uses a small number of
        # genuinely dynamic inline styles (e.g. a computed progress-bar width) — blocking
        # those would silently degrade a couple of visual elements, not break anything
        # functionally, but there's no need to accept that for zero security benefit
        # (inline STYLE cannot execute script; the script-src/object-src/frame-ancestors
        # directives below are what actually matter against XSS/clickjacking).
        # connect-src allows ws:/wss: for the app's own realtime WebSocket (proxied at
        # /ws, same origin). NOTE: verify this against a real browser (in particular the
        # camera-based IMEI/barcode scanner) before relying on it — it was reasoned out
        # from the codebase, not click-tested in a live browser.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

        # PWA Service Worker & Manifest headers (never cache SW)
        location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            proxy_pass http://app_backend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate limited API route
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
