events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log without the query string: older app builds still send the session token as
    # /ws?token=…, and a token must never be written to disk.
    log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log noquery;

    # Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The HTTPS proxy in front (Caddy on the VPS) connects from the host or a Docker network.
    # Only for those addresses $remote_addr becomes the client IP Caddy reports in
    # X-Forwarded-For (Caddy discards client-supplied values), so the rate limit below and
    # the app's req.ip see each client, not the proxy. A direct client keeps its own address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # https when the request reached Caddy over TLS (drives HSTS in the app via req.secure).
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    # Rate Limiting against DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream app_backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # style-src allows 'unsafe-inline' because the app uses a small number of
        # genuinely dynamic inline styles (e.g. a computed progress-bar width) — blocking
        # those would silently degrade a couple of visual elements, not break anything
        # functionally, but there's no need to accept that for zero security benefit
        # (inline STYLE cannot execute script; the script-src/object-src/frame-ancestors
        # directives below are what actually matter against XSS/clickjacking).
        # connect-src allows ws:/wss: for the app's own realtime WebSocket (proxied at
        # /ws, same origin). NOTE: verify this against a real browser (in particular the
        # camera-based IMEI/barcode scanner) before relying on it — it was reasoned out
        # from the codebase, not click-tested in a live browser.
        # script-src allows 'unsafe-eval' because client-side Excel generation (exceljs)
        # uses dynamic evaluation in its browser bundle polyfills.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

        # PWA Service Worker, Manifest & Version endpoint headers (never cache)
        location ~* (sw\.js|registerSW\.js|manifest\.webmanifest|version\.json)$ {
            proxy_pass http://app_backend;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # A location with its own add_header inherits none from the server block.
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        }

        # Root SPA Entry Point (never cache index.html)
        location = /index.html {
            proxy_pass http://app_backend;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Rate limited API route
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $remote_addr is already the real client (see set_real_ip_from): pass only that.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
