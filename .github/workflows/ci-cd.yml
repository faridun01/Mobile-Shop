name: Mobile Shop Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit-tests:
    name: Quality Checks & Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Execute Vitest Unit & Business Logic Tests
        run: npm run test:unit

  e2e-tests:
    name: Playwright Full-Stack E2E Tests (UI -> API -> Postgres)
    needs: quality-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mobile_shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mobile_shop_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/mobile_shop_db?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-prod
      PORT: 3002

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed Database
        run: npx tsx prisma/seed.ts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start API Server
        run: |
          npm run server > api-server.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:3002/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api-server.log
          exit 1

      - name: Start Frontend Dev Server
        run: |
          npm run dev > frontend-server.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat frontend-server.log
          exit 1

      - name: Run Playwright E2E Suite (full business flows, real DB)
        run: npx playwright test

      - name: Run Vitest Integration Suite
        run: npm run test:integration

      - name: Upload Test Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            api-server.log
            frontend-server.log

  security-scan:
    name: Security Audit & Vulnerability Scan
    needs: quality-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Run npm Audit
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image for Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mobile-shop:scan

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mobile-shop:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-build-publish:
    name: Docker Build & Publish to GHCR
    needs: [e2e-tests, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: docker-build-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
