services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: mobile_shop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mobile_shop_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mobile_shop_net

  # Main Application Container (Node.js API + Vite Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile_shop_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/mobile_shop_db?schema=public"
      # Clearly non-production-grade on purpose — this compose file is the local full-stack
      # Docker harness (see docker-compose.prod.yml for the real production config, which
      # fails to boot instead of falling back to a hardcoded secret).
      JWT_SECRET: "local-docker-dev-only-jwt-secret-do-not-use-in-real-production"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      NODE_ENV: "production"
      PORT: "3000"
    healthcheck:
      # 127.0.0.1, not localhost: Alpine's /etc/hosts resolves "localhost" to ::1 only,
      # but the app binds 0.0.0.0 (IPv4-only) — wget would connect to ::1, get refused,
      # and the container would report unhealthy forever despite the app running fine.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mobile_shop_net

  # Nginx Reverse Proxy Container (Rate Limiting and Compression)
  nginx:
    image: nginx:alpine
    container_name: mobile_shop_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mobile_shop_net

volumes:
  postgres_data:
    driver: local

networks:
  mobile_shop_net:
    driver: bridge
