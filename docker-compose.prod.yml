services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: mobile_shop_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      POSTGRES_DB: ${POSTGRES_DB:-mobile_shop_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mobile_shop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mobile_shop_prod_net

  # Production Application Container from GHCR
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-faridun01/mobile-shop}:latest
    container_name: mobile_shop_app_prod
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}@db:5432/${POSTGRES_DB:-mobile_shop_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production}
      APP_URL: ${APP_URL:-}
      NODE_ENV: "production"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mobile_shop_prod_net

  # Nginx Reverse Proxy Container
  nginx:
    image: nginx:alpine
    container_name: mobile_shop_nginx_prod
    restart: always
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mobile_shop_prod_net

volumes:
  postgres_prod_data:
    driver: local

networks:
  mobile_shop_prod_net:
    driver: bridge
